name: Format

on:
  pull_request:

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SWIFTFORMAT_VERSION: "0.64.5"

jobs:
  swiftformat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftFormat
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/swiftformat
          key: swiftformat-linux-${{ env.SWIFTFORMAT_VERSION }}
      - name: Install SwiftFormat
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/swiftformat
          curl -fsSL -o /tmp/swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          unzip -o /tmp/swiftformat.zip -d ~/swiftformat
          chmod +x ~/swiftformat/swiftformat_linux
      - name: SwiftFormat --lint
        run: ~/swiftformat/swiftformat_linux --lint .
