name: Test

# One shard per top-level folder of JblOnMacTests, plus root for the files directly in it.
on:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.shard }})
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [App, Bluetooth, Model, Protocol, Support, Views, root]
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test
        run: make test TEST_SHARD=${{ matrix.shard }} COVERAGE=NO
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.shard }}
          path: |
            build/tests-${{ matrix.shard }}.xcresult
            build/tests-${{ matrix.shard }}.log
