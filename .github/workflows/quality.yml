name: Quality

# The analyzer rules and Periphery need the build log and the index store of the app and the
# test target, so they run after a build here and not in the test shards.
on:
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-swiftlint-0.65.1-periphery
      - name: Install tools
        run: brew install swiftlint periphery
      - name: Build
        run: make build
      - name: Index the test target
        run: make build-for-testing
      - name: SwiftLint analyzer rules
        run: make analyze
      - name: Periphery
        run: make periphery
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-logs
          path: build/*.log
