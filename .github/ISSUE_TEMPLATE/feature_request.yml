name: Feature request
description: Suggest a new feature or an improvement to JBL on Mac
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. If you want support for a JBL model that isn't in the README
        compatibility table, please follow [CONTRIBUTING.md](../blob/master/CONTRIBUTING.md#reporting-device-compatibility) instead.

  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like to see, and why? Describe the problem it solves or the use case.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: How should it work? Describe what the user sees and does, screen by screen if it touches the UI.
      placeholder: |
        - **Calls screen**: ...
        - **Option screens**: ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that tells us when this is done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation notes
      description: Optional. Ideas on how to build it, APIs to use, or pitfalls you already know about.

  - type: input
    id: device
    attributes:
      label: Device
      description: JBL model and firmware version, if the feature depends on specific headphones.
      placeholder: JBL Tune Beam 2, firmware 1.2.3

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots from the official JBL app, PacketLogger captures, or links.
